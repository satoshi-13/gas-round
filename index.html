<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="医療ガス点検">
<meta name="theme-color" content="#24456b">
<title>医療ガス点検</title>
<script>try{var t=JSON.parse(localStorage.getItem('mg_theme')||'"auto"');if(t!=='auto')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#132033; --muted:#5b6878; --faint:#a7b2bf; --line:#d5dce5;
  --accent:#24456b; --on-accent:#ffffff; --accent-soft:#dde7f3;
  --ok:#2e7d4f; --ok-bg:#e1f3e8; --warn:#7a5000; --warn-bg:#fff1b8; --warn-line:#e0b400;
  --alert:#c0303a; --alert-bg:#fbe3e4; --key:#e2e7ee; --empty:#eef1f4; --toast-btn:#9cc6f2;
  --head:#24456b; --on-head:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --surface:#172231; --ink:#e5ecf4; --muted:#93a2b3; --faint:#566779; --line:#283a4e;
    --accent:#7fb2e8; --on-accent:#0b1a2c; --accent-soft:#1c3149;
    --ok:#6fd69a; --ok-bg:#163223; --warn:#ffd45c; --warn-bg:#3a3110; --warn-line:#c9a200;
    --alert:#ff7b84; --alert-bg:#3d1a1d; --key:#223246; --empty:#131d29; --toast-btn:#24456b;
    --head:#162b44; --on-head:#e5ecf4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --surface:#172231; --ink:#e5ecf4; --muted:#93a2b3; --faint:#566779; --line:#283a4e;
  --accent:#7fb2e8; --on-accent:#0b1a2c; --accent-soft:#1c3149;
  --ok:#6fd69a; --ok-bg:#163223; --warn:#ffd45c; --warn-bg:#3a3110; --warn-line:#c9a200;
  --alert:#ff7b84; --alert-bg:#3d1a1d; --key:#223246; --empty:#131d29; --toast-btn:#24456b;
  --head:#162b44; --on-head:#e5ecf4; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ヘッダー */
.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--on-head);
  padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px 14px;display:flex;align-items:center;gap:6px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap}
#sync{font-size:12px;opacity:.9;white-space:nowrap}
.top .icon{color:var(--on-head);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.top .icon svg{width:22px;height:22px;display:block}
.top .icon:active{background:rgba(255,255,255,.18)}
.top .who{color:var(--on-head);font-size:14px;font-weight:700;padding:5px 11px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 40px)}
main.with-bar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
main.with-sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 380px)}

/* 点検者 */
.who-title{font-size:22px;font-weight:700;margin:18px 0 2px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:16px}
.names button{background:var(--surface);border:2px solid var(--line);border-radius:14px;height:72px;font-size:20px;font-weight:700}
.names button.last{border-color:var(--accent)}

/* 日付・進捗 */
.datebar{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.datebar .d{font-size:20px;font-weight:700;flex:1;text-align:center}
.datebar .past{display:block;font-size:11px;color:var(--warn);font-weight:600}
.datebar button{width:42px;height:42px;border-radius:12px;background:var(--surface);font-size:22px;border:1px solid var(--line)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ptext{font-size:12px;color:var(--muted);text-align:right;margin-bottom:8px}
.banner{padding:9px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.err{background:var(--alert-bg);color:var(--alert)}
h2{font-size:14px;margin:16px 2px 6px;color:var(--muted);font-weight:600}

/* 酸素カード */
.oxy{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 4px;margin-bottom:6px}
.oxy-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.oxy-h b{flex:1;font-size:15px}
.oxy-h button{color:var(--accent);font-weight:700;font-size:14px}
.orow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0}
.orow .n{font-size:14px;font-weight:600}
.orow .n small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.orow .days{font-size:22px;font-weight:800;text-align:right;min-width:74px}
.orow .days small{font-size:12px;font-weight:600;margin-left:2px}
.orow .when{font-size:12px;color:var(--muted);text-align:right;min-width:64px}
.orow.warn .days{color:var(--warn)} .orow.alert .days{color:var(--alert)} .orow.ok .days{color:var(--ok)}
.orow.warn{background:linear-gradient(90deg,var(--warn-bg),transparent 70%)}
.orow.alert{background:linear-gradient(90deg,var(--alert-bg),transparent 70%)}

/* 場所の一覧 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 12px 13px 14px;border-bottom:1px solid var(--line);border-left:6px solid transparent}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.row.alert{border-left-color:var(--alert)}
.row b{font-size:18px;flex:1}
.row .cnt{font-size:13px;color:var(--muted)}
.chip{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap;font-weight:600}
.chip.done{background:var(--ok-bg);color:var(--ok)} .chip.part{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--alert-bg);color:var(--alert)} .chip.pic{background:var(--accent-soft);color:var(--accent)}
.chev{color:var(--faint);font-size:18px}

/* 入力画面 */
.entry-head{display:flex;align-items:center;gap:8px}
.back{font-size:15px;color:var(--accent);font-weight:600;padding:8px 0}
.entry-head h2{margin:0;flex:1;text-align:right;color:var(--ink);font-size:21px}
.sub-head{font-size:13px;color:var(--muted);margin:2px 0 10px}
.sub-head .ghost{color:var(--faint)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--accent-soft)}
.grp-h b{flex:1;font-size:15px}
.grp-h button{font-size:13px;font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.it{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.it:first-of-type{border-top:0}
.it .nm{flex:1 1 140px;min-width:0;font-size:15px;font-weight:600;line-height:1.3}
.it .nm small{display:block;font-size:12px;color:var(--faint);font-weight:400}
.it .ctl{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.it.alert{background:var(--alert-bg)}
.seg{display:flex;gap:5px}
.seg button{width:58px;height:44px;border-radius:10px;border:2px solid var(--line);font-size:17px;font-weight:700;background:var(--bg)}
.seg .y.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .n.sel{background:var(--alert);border-color:var(--alert);color:#fff}
.seg .y.prev{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.chips{display:flex;gap:5px}
.chips button{min-width:46px;height:44px;padding:0 9px;border-radius:10px;border:2px solid var(--line);font-size:15px;font-weight:700;background:var(--bg)}
.chips button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips button.prev{border-style:dashed;border-color:var(--faint)}
.vbox{min-width:104px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:0 10px;text-align:right;font-size:20px;font-weight:700}
.vbox small{font-size:12px;font-weight:500;margin-left:3px;color:var(--muted)}
.vbox.empty{color:var(--faint);font-weight:500}
.vbox.act{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vbox.alert{border-color:var(--alert);color:var(--alert);background:var(--alert-bg)}
.cam{width:44px;height:44px;border-radius:10px;background:var(--alert);color:#fff;display:grid;place-items:center}
.cam svg{width:22px;height:22px}

.photos{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.photos-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.photos-h b{flex:1;font-size:15px}
.addpic{display:flex;gap:6px;align-items:center;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.addpic svg{width:18px;height:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--empty);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;line-height:1.25;padding:3px 5px;background:rgba(10,20,30,.62);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb em{position:absolute;top:4px;right:4px;font-style:normal;font-size:10px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:0 5px;font-weight:700}
.notebox textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.savebar button{display:block;width:100%;max-width:576px;margin:0 auto;height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(10,30,40,.14);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.sheet.anim{animation:up .16s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-in{max-width:576px;margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sheet-head b{flex:1;font-size:15px;line-height:1.25}
.sheet-head b small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.sheet-head button{height:40px;padding:0 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--key)}
.sheet-head .go{background:var(--accent);color:var(--on-accent)}
.readout{font-size:34px;font-weight:700;text-align:right;padding:0 4px;min-height:44px}
.readout small{font-size:15px;color:var(--muted);margin-left:4px;font-weight:500}
.readout.alert{color:var(--alert)}
.hint{font-size:13px;min-height:18px;margin:0 4px 6px;color:var(--muted);text-align:right}
.hint.alert{color:var(--alert);font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keypad button{background:var(--key);height:54px;border-radius:12px;font-size:25px;font-weight:600}
.keypad button:active{background:var(--line)}

/* 推移 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0;font-size:16px}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.card .stats div{background:var(--bg);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--muted)}
.card .stats b{display:block;font-size:18px;color:var(--ink)}
.card .stats .warn b{color:var(--warn)} .card .stats .alert b{color:var(--alert)}
svg.chart{width:100%;height:auto;display:block}
svg .ax{stroke:var(--line);stroke-width:1}
svg text{fill:var(--muted);font-size:10px}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2.2}
svg .pt{fill:var(--accent)}
svg .ev{fill:var(--warn-line)}
svg .th{stroke:var(--alert);stroke-dasharray:4 3}
svg .thl{fill:var(--alert)}
svg .fc{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:2}
.seg-tabs{display:flex;gap:6px;margin:4px 0 10px}
.seg-tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.seg-tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* 月別 */
.mbar{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.mbar .d{flex:1;text-align:center;font-size:20px;font-weight:700}
.mbar button{width:42px;height:42px;border-radius:12px;background:var(--surface);font-size:22px;border:1px solid var(--line)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filters button{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mwrap{overflow:auto;max-height:calc(100vh - 220px);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mt{border-collapse:separate;border-spacing:0;font-size:12px}
.mt th,.mt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:34px}
.mt thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;min-width:44px;text-align:center;line-height:1.15;color:var(--muted)}
.mt thead th.sun{color:var(--alert)} .mt thead th.sat{color:#3b6fd8}
.mt thead th.td{background:var(--accent);color:var(--on-accent)}
.mt .sl{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:2px 8px;min-width:128px;max-width:128px;font-weight:600;line-height:1.2;font-size:11.5px}
.mt thead .sl{z-index:3}
.mt tr.gh .sl{background:var(--bg);font-size:12.5px;color:var(--ink)}
.mt tr.gh td{background:var(--bg)}
.mt td{text-align:center;min-width:44px}
.mt td button{width:100%;height:100%;font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.1}
.mt td.ok{color:var(--ok)} .mt td.alert{background:var(--alert-bg);color:var(--alert)} .mt td.miss{background:var(--empty)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

/* 写真ビューア */
.viewer{position:fixed;inset:0;z-index:30;background:rgba(5,10,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.viewer img{max-width:100%;max-height:78vh;border-radius:8px}
.viewer p{color:#e5ecf4;font-size:14px;margin:10px 0 0;text-align:center}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;color:#fff;font-size:30px;width:48px;height:48px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%) translateY(-12px);opacity:0;visibility:hidden;
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;width:max-content;max-width:92vw;
  display:flex;gap:16px;align-items:center;transition:transform .18s,opacity .18s,visibility .18s;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#toast button{color:var(--toast-btn);font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>医療ガス点検</h1>
  <span id="sync"></span>
  <button class="icon" id="trendBtn" data-act="trend" aria-label="残量の推移" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg></button>
  <button class="icon" id="cal" data-act="month" aria-label="月別一覧" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17.5h2" stroke-width="2.4"/></svg></button>
  <button class="icon" id="theme" data-act="theme"></button>
  <button class="who" id="who" data-act="who" hidden></button>
</header>
<main id="app"></main>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<div id="toast" role="status"></div>

<script>
/* ===== 設定 =====
 * GitHub Pages で使う場合：GASを「ウェブアプリ」としてデプロイしたURLを入れてください。
 * （GAS単体で使う場合は空欄のままでOK） */
const API_URL = 'https://script.google.com/macros/s/AKfycbwc2tRybZfhgIm9DUxW3zVz9jZBenIph1smzccwHWVV-PHrGgf9N5ufPzS0BZFRbpUbJw/exec';

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const app = document.getElementById('app');

const store = {
  get(k, d) { try { const v = localStorage.getItem('mg_' + k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('mg_' + k, JSON.stringify(v)); return true; } catch (_) { return false; } }
};

/* ---------- 表示テーマ ---------- */
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const CAM = SVG('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>');
const THEMES = {
  auto: [SVG('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'), '自動（端末の設定に合わせる）'],
  light: [SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>'), '明るい表示'],
  dark: [SVG('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'), '暗い表示']
};
let theme = store.get('theme', 'auto');
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const b = document.getElementById('theme');
  b.innerHTML = THEMES[theme][0]; b.setAttribute('aria-label', '表示の切り替え：' + THEMES[theme][1]);
  const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#162b44' : '#24456b';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ---------- 日付 ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function shiftDate(s, n) { const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }
function fmtJP(s) { const [y, m, d] = s.split('-').map(Number); return `${m}/${d}(${'日月火水木金土'[new Date(y, m - 1, d).getDay()]})`; }
function md(s) { return `${+s.slice(5, 7)}/${+s.slice(8, 10)}`; }
function dayNum(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; }
function shiftMonth(ym, n) { const [y, m] = ym.split('-').map(Number); const t = new Date(y, m - 1 + n, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 項目の扱い ---------- */
const label = i => i.item_name + (i.sub ? ' ' + i.sub : '');
const hasVal = v => v !== undefined && v !== null && v !== '';
function isDone(i, d) {
  if (!d) return false;
  if (i.input_type === 'bool') return d.v === true || d.v === false;
  if (i.input_type === 'num') return hasVal(d.v);
  if (i.input_type === 'choice') return !!d.c;
  return !!d.c || hasVal(d.v);
}
function levelOf(i, d) {
  if (!isDone(i, d)) return '';
  if (i.input_type === 'bool') return d.v ? 'ok' : 'alert';
  if ((i.input_type === 'num' || i.input_type === 'pair') && hasVal(d.v)) {
    const v = Number(d.v);
    if ((i.low !== null && v < i.low) || (i.high !== null && v > i.high)) return 'alert';
  }
  return 'ok';
}
function fmtVal(i, d) {
  if (!d) return '';
  if (i.input_type === 'bool') return d.v ? '✓' : '×';
  if (i.input_type === 'num') return hasVal(d.v) ? String(d.v) : '';
  if (i.input_type === 'choice') return d.c || '';
  return [d.c, hasVal(d.v) ? d.v : ''].filter(String).join(' ');
}

/* ---------- 通信 ---------- */
const S = {
  apiUrl: API_URL || store.get('apiUrl', ''),
  user: '', lastUser: store.get('lastUser', ''),
  date: todayStr(), data: null, loading: false, error: '',
  view: 'who', loc: null, draft: {}, note: '', active: null, dirty: false, sheetAnim: false, photoTarget: ''
};

function call(action, payload = {}) {
  const req = Object.assign({ action }, payload);
  const unwrap = r => { if (!r || !r.ok) { const e = new Error(r ? r.error : '応答がありません'); e.server = true; throw e; } return r.data; };
  if (IS_GAS) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(r => { try { res(unwrap(r)); } catch (e) { rej(e); } })
      .withFailureHandler(rej).api(req));
  }
  return fetch(S.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
    .then(r => r.json()).then(unwrap);
}

/* =========================================================
 * 送信箱（楽観的UI）：操作は端末に保存して即反映、裏でまとめて送信
 * ======================================================= */
const OB = { ops: store.get('outbox', []), busy: false, timer: null };
const SENT = [];
OB.ops.forEach(o => delete o.inflight);
function saveOutbox() {
  const ok = store.set('outbox', OB.ops.map(({ inflight, ...o }) => o));
  if (!ok) toast('端末の保存容量が足りません。通信できる場所で開き直してください');
}
function enqueue(op) {
  op.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  OB.ops.push(op); saveOutbox(); applyOp(op); kick(400);
}
function applyOp(op) {
  if (!S.data || op.date !== S.date || op.type !== 'save') return;
  op.records.forEach(r => {
    const it = S.data.items.find(i => i.item_id === r.item_id);
    if (it) it.today = { c: r.c || '', v: r.v, user: op.user, note: op.note };
  });
}
function kick(delay) { clearTimeout(OB.timer); OB.timer = setTimeout(drain, delay); updateSync(); }
async function drain() {
  if (OB.busy || !OB.ops.length) return;
  OB.busy = true;
  // 写真は1枚ずつ、記録はまとめて送る
  let batch = [];
  if (OB.ops[0].type === 'photo') batch = [OB.ops[0]];
  else for (const o of OB.ops) { if (o.type === 'photo' || batch.length >= 20) break; batch.push(o); }
  batch.forEach(o => o.inflight = true);
  updateSync();
  try {
    const res = await call('sync', { ops: batch.map(({ inflight, preview, ...o }) => o) });
    OB.ops = OB.ops.filter(o => !batch.includes(o));
    batch.filter(o => o.type === 'photo').forEach(o => SENT.push(o));   // 送信済みの写真はこの端末ではそのまま表示し続ける
    if (batch.some(o => o.type === 'photo') && (S.view === 'entry' || S.view === 'home')) render();   // 「未送信」の表示を消す
    saveOutbox();
    const failed = res.results.filter(r => !r.ok);
    if (failed.length) toast('保存できなかった記録があります：' + failed[0].error);
    OB.busy = false;
    if (OB.ops.length) kick(0); else scheduleRefresh(1500);
  } catch (e) {
    batch.forEach(o => delete o.inflight);
    OB.busy = false;
    if (e.server) toast('送信エラー：' + e.message);
    kick(e.server ? 20000 : 8000);
  }
  updateSync();
}
function updateSync() {
  const n = OB.ops.length;
  document.getElementById('sync').textContent = !n ? '' : (navigator.onLine === false ? `未送信 ${n}件` : '送信中…');
}
let refreshTimer;
function scheduleRefresh(delay) {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { if (!OB.ops.length && (S.view === 'home' || S.view === 'trend')) load(true); }, delay);
}

async function load(quiet) {
  S.loading = true; S.error = '';
  if (!quiet) render();
  const date = S.date;
  try {
    const d = await call('bootstrap', { date });
    if (date !== S.date) { S.loading = false; return; }
    S.data = d; store.set('cache', d);
  } catch (e) {
    S.error = e.server ? e.message : '通信できません。入力は端末に保存され、あとで送信されます';
  }
  OB.ops.forEach(applyOp);
  S.loading = false;
  if (['home', 'who', 'trend'].includes(S.view) || !quiet) render();
}
function fromCache() {
  const c = store.get('cache', null);
  if (!c) return null;
  if (c.date === S.date) return c;
  return Object.assign({}, c, { date: S.date, photos: [], items: c.items.map(i => Object.assign({}, i, {
    previous: i.today && c.date < S.date ? { date: c.date, c: i.today.c, v: i.today.v } : i.previous, today: null })) });
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function locations() {

  (S.data ? S.data.items : []).forEach(i => { if (!out.includes(i.location)) out.push(i.location); });
  return out;
}
const dayLeftText = s => s.days_left === null ? '—' : (s.days_left >= 100 ? '100+' : String(Math.round(s.days_left * 10) / 10));

function locRow(loc) {
  const its = S.data.items.filter(i => i.location === loc);

  return `<button class="row ${bad ? 'alert' : ''}" data-act="entry" data-loc="${esc(loc)}">
    <b>${esc(loc)}</b>
    ${bad ? `<span class="chip bad">異常 ${bad}</span>` : ''}${pics ? `<span class="chip pic">写真 ${pics}</span>` : ''}
    <span class="cnt num">${n}/${daily.length}</span>${chip}<span class="chev">›</span></button>`;
}

/* ---- 写真 ---- */
function photosFor(loc) {
  const server = (S.data && S.data.photos || []).filter(p => p.location === loc)
    .map(p => { const mine = SENT.find(o => o.id === p.photo_id);
      return { key: p.file_id, file_id: mine ? '' : p.file_id, src: mine ? 'data:image/jpeg;base64,' + mine.data : '', name: p.item_name, user: p.user, time: p.time }; });
  const ids = new Set(((S.data && S.data.photos) || []).map(p => p.photo_id));
  const local = SENT.filter(o => !ids.has(o.id)).map(o => Object.assign({}, o, { sent: true }))
    .concat(OB.ops.filter(o => o.type === 'photo'))
    .filter(o => o.date === S.date && o.location === loc)
    .map(o => ({ key: o.id, src: 'data:image/jpeg;base64,' + o.data, name: o.item_name, user: o.user, pending: !o.sent }));
  return server.concat(local);
}
const THUMBS = {};
function loadThumb(id) {
  if (THUMBS[id]) return;
  THUMBS[id] = 'loading';
  call('photo', { file_id: id }).then(r => {
    THUMBS[id] = r.data;
    document.querySelectorAll(`img[data-fid="${id}"]`).forEach(img => img.src = r.data);
  }).catch(() => { delete THUMBS[id]; });
}
/* 撮った写真を縮小（長辺1280px・JPEG）して送る。容量を抑えて通信と端末保存を軽くする */
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
document.getElementById('photoInput').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  try {
    const data = await compress(f);
    const it = S.data.items.find(i => i.item_id === S.photoTarget);
    enqueue({ type: 'photo', date: S.date, user: S.user, location: S.loc, item_id: S.photoTarget || '', item_name: it ? it.group + ' ' + label(it) : '（場所全体）', note: '', data });
    toast('写真を保存しました');
    if (S.view === 'entry') renderEntry();
  } catch (e) { toast(e.message); }
});

/* ---- 入力画面 ---- */
function locItems() { return S.data.items.filter(i => i.location === S.loc); }
function groupsOf(items) {
  const out = [];
  items.forEach(i => { const g = out[out.length - 1]; if (g && g.name === i.group) g.items.push(i); else out.push({ name: i.group, items: [i] }); });
  return out;
}
function openEntry(loc) {
  S.loc = loc; S.note = ''; S.active = null; S.dirty = false; S.draft = {};
  locItems().forEach(i => {
    if (i.today) { S.draft[i.item_id] = { c: i.today.c || '', v: i.input_type === 'bool' ? i.today.v : (hasVal(i.today.v) ? String(i.today.v) : '') }; if (i.today.note) S.note = i.today.note; }
  });
  S.view = 'entry'; render(); window.scrollTo(0, 0);
}

function renderEntry() {
  const its = locItems();
  const daily = its.filter(i => i.daily);
  const n = daily.filter(i => isDone(i, S.draft[i.item_id])).length;
  const any = its.some(i => isDone(i, S.draft[i.item_id]));
  const pics = photosFor(S.loc);
  pics.forEach(p => { if (p.file_id && !THUMBS[p.file_id]) loadThumb(p.file_id); });
  app.className = S.active ? 'with-sheet' : 'with-bar';
  app.innerHTML = `
    <div class="entry-head"><button class="back" data-act="leave">‹ 一覧</button><h2>${esc(S.loc)}</h2></div>
    <p class="sub-head">${fmtJP(S.date)}　${esc(S.user)}　<span class="ghost">点線・薄い文字は前回の記録</span></p>
    ${groupsOf(its).map((g, gi) => {
      const unsetBool = g.items.filter(i => i.input_type === 'bool' && !isDone(i, S.draft[i.item_id])).length;
      return `<section class="grp"><div class="grp-h"><b>${esc(g.name)}</b>${unsetBool ? `<button data-act="grpok" data-g="${gi}">未入力を ✓（${unsetBool}）</button>` : ''}</div>
        ${g.items.map(itemRow).join('')}</section>`;
    }).join('')}
    <section class="photos">
      <div class="photos-h"><b>写真</b><button class="addpic" data-act="photo" data-id="">${CAM}写真を追加</button></div>
      ${pics.length ? `<div class="thumbs">${pics.map(p => `<button class="thumb" data-act="view" data-key="${esc(p.key)}">
        <img ${p.src ? `src="${p.src}"` : `data-fid="${esc(p.file_id)}" ${THUMBS[p.file_id] && THUMBS[p.file_id] !== 'loading' ? `src="${THUMBS[p.file_id]}"` : ''}`} alt="">
        ${p.pending ? '<em>未送信</em>' : ''}<span>${esc(p.name)}</span></button>`).join('')}</div>`
        : '<p class="muted" style="font-size:13px;margin:0">見た目に異常があれば撮影してください。✗ を付けた項目には撮影ボタンが出ます。</p>'}
    </section>
    <div class="notebox"><textarea id="f-note" rows="2" placeholder="備考（任意）例：窒素ボンベ交換、吸引装置フィルター交換">${esc(S.note)}</textarea></div>
    ${S.active ? keypadSheet() : `<div class="savebar"><button data-act="save" ${any ? '' : 'disabled'}>保存する（${n}/${daily.length}）</button></div>`}`;
}

function itemRow(i) {
  const d = S.draft[i.item_id] || {};
  const p = i.previous;
  const lvl = levelOf(i, d);
  const prevTxt = p ? `前回 ${esc(fmtVal(i, p))}${i.input_type === 'num' || (i.input_type === 'pair' && hasVal(p.v)) ? esc(i.unit) : ''}（${md(p.date)}）` : '';
  let ctl = '';
  if (i.input_type === 'bool') {
    ctl = `<div class="seg">
      <button class="y ${d.v === true ? 'sel' : (d.v === undefined && p && p.v === true ? 'prev' : '')}" data-act="bool" data-id="${i.item_id}" data-v="1" aria-label="異常なし">✓</button>
      <button class="n ${d.v === false ? 'sel' : ''}" data-act="bool" data-id="${i.item_id}" data-v="0" aria-label="異常あり">✗</button></div>
      ${d.v === false ? `<button class="cam" data-act="photo" data-id="${i.item_id}" aria-label="写真を撮る">${CAM}</button>` : ''}`;
  }
  if (i.input_type === 'choice' || i.input_type === 'pair') {
    ctl += `<div class="chips">${i.options.map(o => `<button class="${d.c === o ? 'sel' : (!d.c && p && p.c === o ? 'prev' : '')}" data-act="choice" data-id="${i.item_id}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  if (i.input_type === 'num' || i.input_type === 'pair') {
    const has = hasVal(d.v);
    const shown = has ? d.v : (p && hasVal(p.v) ? p.v : '—');
    ctl += `<button class="vbox num ${has ? '' : 'empty'} ${S.active === i.item_id ? 'act' : ''} ${lvl === 'alert' ? 'alert' : ''}" data-act="field" data-id="${i.item_id}" id="f-${i.item_id}">${esc(shown)}<small>${esc(i.unit)}</small></button>`;
  }
  return `<div class="it ${lvl === 'alert' ? 'alert' : ''}" id="r-${i.item_id}">
    <div class="nm">${esc(label(i))}${prevTxt ? `<small>${prevTxt}</small>` : ''}</div><div class="ctl">${ctl}</div></div>`;
}

const findItem = id => S.data.items.find(i => i.item_id === id);
function numFields() { return locItems().filter(i => i.input_type === 'num' || i.input_type === 'pair'); }
function nextField(i) { const l = numFields(); return l[l.indexOf(i) + 1] || null; }

function keypadSheet() {
  const i = findItem(S.active);
  const d = S.draft[i.item_id] || {};
  const lvl = levelOf(i, d);
  let hint = i.low !== null || i.high !== null ? `基準 ${i.low ?? ''}〜${i.high ?? ''} ${i.unit}` : '';
  if (lvl === 'alert') hint = '基準の範囲外です';
  const anim = S.sheetAnim; S.sheetAnim = false;
  return `<div class="sheet ${anim ? 'anim' : ''}"><div class="sheet-in">
    <div class="sheet-head"><b>${esc(label(i))}<small>${esc(i.group)}${i.previous && hasVal(i.previous.v) ? `　前回 ${i.previous.v}${esc(i.unit)}` : ''}</small></b>
      <button data-act="clear">C</button>
      <button data-act="same" ${i.previous && hasVal(i.previous.v) ? '' : 'disabled'}>前回と同じ</button>
      <button class="go" data-act="nextField">${nextField(i) ? '次へ' : '完了'}</button></div>
    <div class="readout num ${lvl === 'alert' ? 'alert' : ''}">${hasVal(d.v) ? esc(d.v) : '<span style="color:var(--faint)">0</span>'}<small>${esc(i.unit)}</small></div>
    <div class="hint ${lvl === 'alert' ? 'alert' : ''}">${esc(hint)}</div>
    <div class="keypad">${['7', '8', '9', '4', '5', '6', '1', '2', '3', '.', '0', '⌫'].map(k =>
      `<button data-act="key" data-k="${k}" aria-label="${k === '⌫' ? '1文字消す' : k}">${k}</button>`).join('')}</div>
  </div></div>`;
}
function setActive(id) {
  S.sheetAnim = !S.active && !!id;
  S.active = id; renderEntry();
  if (id) { const el = document.getElementById('r-' + id); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function draftOf(id) { return S.draft[id] || (S.draft[id] = { c: '', v: undefined }); }

/* ---- 残量の推移 ---- */
function renderTrend() {
  const sup = S.data ? S.data.supply : [];
  const tab = S.trendTab || '酸素';
  const list = sup.filter(s => tab === '酸素' ? s.gas === '酸素' : s.gas !== '酸素');
  app.innerHTML = `
    <div class="entry-head"><button class="back" data-act="home">‹ ホーム</button><h2>残量の推移</h2></div>
    <div class="seg-tabs"><button class="${tab === '酸素' ? 'on' : ''}" data-act="ttab" data-t="酸素">酸素</button><button class="${tab !== '酸素' ? 'on' : ''}" data-act="ttab" data-t="他">窒素・炭酸ガス</button></div>
    ${list.map(s => `<div class="card">
      <h3>${esc(s.label)}</h3>
      <div class="stats num">
        <div>現在値<b>${s.current === null ? '—' : (s.side ? esc(s.side) + ' ' : '') + s.current}<small style="font-size:12px"> ${esc(s.unit)}</small></b></div>
        <div>1日の使用量<b>${s.avg === null ? '—' : s.avg}</b></div>
        <div class="${s.level}">残り日数<b>${dayLeftText(s)}${s.days_left !== null ? '日' : ''}</b></div>
      </div>
      <p class="muted" style="font-size:12.5px;margin:0 0 6px">${s.predicted ? `下限 ${s.limit}${esc(s.unit)} に届く見込み：${fmtJP(s.predicted)}` : '2日分以上の記録がたまると予測を表示します'}${s.usage.some(u => u.event) ? '　黄色の点＝交換・補充' : ''}</p>
      ${lineChart(s)}</div>`).join('') || '<p class="muted">対象の設備がありません</p>'}
    <p class="muted" style="font-size:12px">残り日数＝（現在値 − 下限）÷ 直近14日の1日平均使用量。交換・補充した日は平均から除いています。下限はスプレッドシートの「マスタ」の limit で変更できます。</p>`;
}

function lineChart(s) {
  const pts = s.series;
  if (!pts.length) return '<p class="muted">記録がありません</p>';
  const W = 340, H = 170, L = 34, R = 10, T = 12, B = 22;
  const x0 = dayNum(pts[0].d);
  let x1 = dayNum(pts[pts.length - 1].d);
  if (s.predicted) x1 = Math.max(x1, dayNum(s.predicted));
  if (x1 === x0) x1 = x0 + 1;
  const ymax = Math.max(...pts.map(p => p.v), s.limit || 0) * 1.1 || 1;
  const sx = d => (L + (dayNum(d) - x0) / (x1 - x0) * (W - L - R)).toFixed(1);
  const sy = v => (T + (1 - v / ymax) * (H - T - B)).toFixed(1);
  const ev = new Set(s.usage.filter(u => u.event).map(u => u.d));
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label)}の推移">`;
  [0, ymax / 2, ymax].forEach(v => { g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 4}" y="${+sy(v) + 3}" text-anchor="end">${Math.round(v * 10) / 10}</text>`; });
  if (s.limit !== null) g += `<line class="th" x1="${L}" x2="${W - R}" y1="${sy(s.limit)}" y2="${sy(s.limit)}"/><text class="thl" x="${W - R}" y="${sy(s.limit) - 4}" text-anchor="end">下限 ${s.limit}</text>`;
  g += `<polyline class="ln" points="${pts.map(p => sx(p.d) + ',' + sy(p.v)).join(' ')}"/>`;
  g += pts.map(p => `<circle class="${ev.has(p.d) ? 'ev' : 'pt'}" cx="${sx(p.d)}" cy="${sy(p.v)}" r="${ev.has(p.d) ? 4 : 2.6}"/>`).join('');
  if (s.predicted && s.limit !== null) { const lp = pts[pts.length - 1]; g += `<line class="fc" x1="${sx(lp.d)}" y1="${sy(lp.v)}" x2="${sx(s.predicted)}" y2="${sy(s.limit)}"/>`; }
  const endD = s.predicted && dayNum(s.predicted) > dayNum(pts[pts.length - 1].d) ? s.predicted : pts[pts.length - 1].d;
  g += `<text x="${L}" y="${H - 6}">${fmtJP(pts[0].d)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtJP(endD)}</text>`;
  return g + '</svg>';
}

/* ---- 月別一覧 ---- */
const M = { ym: '', loc: '', data: null, error: '' };
async function openMonth(ym, loc) {
  M.ym = ym; M.loc = loc || M.loc || locations()[0]; M.data = null; M.error = '';
  S.view = 'month'; render();
  try {
    const d = await call('month', { ym: M.ym, location: M.loc });
    if (M.ym !== ym || (loc && M.loc !== loc)) return;
    M.data = d;
  } catch (e) { M.error = e.server ? e.message : '通信できないため表示できません'; }
  if (S.view === 'month') { render(); const w = document.getElementById('mwrap'), t = document.getElementById('m-today'); if (w && t) w.scrollLeft = Math.max(0, t.offsetLeft - 128 - 44 * 4); }
}
function renderMonth() {
  const [y, m] = M.ym.split('-').map(Number);
  const isNow = M.ym === todayStr().slice(0, 7);
  let body = '<p class="muted">読み込んでいます…</p>';
  if (M.error) body = `<div class="banner err">${esc(M.error)}</div>`;
  else if (M.data) {
    const D = M.data, today = todayStr(), W = '日月火水木金土';
    let head = '<tr><th class="sl">項目</th>';
    for (let d = 1; d <= D.days; d++) {
      const ds = `${M.ym}-${pad(d)}`, wd = new Date(y, m - 1, d).getDay();
      head += `<th class="${ds === today ? 'td' : wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}" ${ds === today ? 'id="m-today"' : ''}>${d}<br>${W[wd]}</th>`;
    }
    let rows = '';
    groupsOf(D.items).forEach(g => {
      rows += `<tr class="gh"><th class="sl">${esc(g.name)}</th><td colspan="${D.days}"></td></tr>`;
      g.items.forEach(i => {
        rows += `<tr><th class="sl">${esc(label(i))}${i.unit ? `<span class="muted">(${esc(i.unit)})</span>` : ''}</th>`;
        for (let d = 1; d <= D.days; d++) {
          const ds = `${M.ym}-${pad(d)}`;
          const c = D.cells[i.item_id] && D.cells[i.item_id][d];
          if (!c) { rows += `<td class="${ds < today && i.daily ? 'miss' : ''}"></td>`; continue; }
          const dd = { c: c[0], v: c[1] };
          rows += `<td class="${levelOf(i, dd)}"><button data-act="mcell" data-id="${esc(i.item_id)}" data-d="${d}">${esc(fmtVal(i, dd)).replace(' ', '<br>')}</button></td>`;
        }
        rows += '</tr>';
      });
    });
    body = `<div class="mwrap" id="mwrap"><table class="mt"><thead>${head}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="legend">赤＝異常・基準外　灰＝未入力　マスをタップで点検者を表示</p>`;
  }
  app.innerHTML = `
    <div class="entry-head"><button class="back" data-act="home">‹ ホーム</button><h2>月別一覧</h2></div>
    <div class="mbar"><button data-act="mprev" aria-label="前の月">‹</button><div class="d num">${y}年${m}月</div><button data-act="mnext" aria-label="次の月" ${isNow ? 'disabled' : ''}>›</button></div>
    <div class="filters">${locations().map(l => `<button class="${M.loc === l ? 'on' : ''}" data-act="mloc" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>
    ${body}`;
}

/* ---- 写真ビューア ---- */
function viewPhoto(key) {
  const p = photosFor(S.loc).find(x => x.key === key);
  if (!p) return;
  const src = p.src || (THUMBS[p.file_id] !== 'loading' && THUMBS[p.file_id]) || '';
  const v = document.createElement('div');
  v.className = 'viewer';
  v.innerHTML = `<button aria-label="閉じる">×</button>${src ? `<img src="${src}" alt="">` : '<p>読み込み中…</p>'}<p>${esc(p.name)}　${esc(p.user || '')} ${esc(p.time || '')}${p.pending ? '（未送信）' : ''}</p>`;
  v.addEventListener('click', () => v.remove());
  document.body.appendChild(v);
}

/* =================== 操作 =================== */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;

  if (act === 'saveUrl') {
    const u = document.getElementById('f-url').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(u)) { toast('script.google.com のURLを入力してください'); return; }
    S.apiUrl = u; store.set('apiUrl', u); S.view = 'who'; load();
  }
  else if (act === 'who') { S.view = 'who'; render(); }
  else if (act === 'pickUser') { S.user = b.dataset.name; S.lastUser = S.user; store.set('lastUser', S.user); S.view = 'home'; render(); }
  else if (act === 'theme') { theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'; store.set('theme', theme); applyTheme(); toast('表示：' + THEMES[theme][1]); }
  else if (act === 'home') { S.view = 'home'; render(); window.scrollTo(0, 0); load(true); }
  else if (act === 'prevDay' || act === 'nextDay') {
    S.date = shiftDate(S.date, act === 'prevDay' ? -1 : 1);
    S.data = fromCache(); if (S.data) OB.ops.forEach(applyOp);
    render(); load(true);
  }
  else if (act === 'trend') { S.view = 'trend'; render(); window.scrollTo(0, 0); }
  else if (act === 'ttab') { S.trendTab = b.dataset.t; render(); }
  else if (act === 'month') openMonth(S.date.slice(0, 7));
  else if (act === 'mprev') openMonth(shiftMonth(M.ym, -1));
  else if (act === 'mnext') openMonth(shiftMonth(M.ym, 1));
  else if (act === 'mloc') openMonth(M.ym, b.dataset.l);
  else if (act === 'mcell') {
    const i = M.data.items.find(x => x.item_id === b.dataset.id);
    const c = M.data.cells[i.item_id][+b.dataset.d];
    toast(`${+M.ym.slice(5)}/${b.dataset.d} ${i.group} ${label(i)}：${fmtVal(i, { c: c[0], v: c[1] })}${hasVal(c[1]) && i.unit ? i.unit : ''}（${c[2] || '不明'}）`);
  }

  else if (act === 'entry') openEntry(b.dataset.loc);
  else if (act === 'leave') { if (S.dirty && !confirm('保存せずに一覧へ戻りますか？')) return; S.view = 'home'; S.active = null; render(); }
  else if (act === 'bool') { draftOf(b.dataset.id).v = b.dataset.v === '1'; S.dirty = true; S.active = null; renderEntry(); }
  else if (act === 'choice') {
    const i = findItem(b.dataset.id), d = draftOf(i.item_id);
    d.c = d.c === b.dataset.o ? '' : b.dataset.o; S.dirty = true;
    // 残量など数値もある項目は、続けてテンキーを開く
    if (i.input_type === 'pair' && d.c && !hasVal(d.v)) setActive(i.item_id); else renderEntry();
  }
  else if (act === 'grpok') {
    const g = groupsOf(locItems())[+b.dataset.g];
    g.items.forEach(i => { if (i.input_type === 'bool' && !isDone(i, S.draft[i.item_id])) draftOf(i.item_id).v = true; });
    S.dirty = true; renderEntry();
  }
  else if (act === 'field') setActive(S.active === b.dataset.id ? null : b.dataset.id);
  else if (act === 'key') {
    const d = draftOf(S.active);
    let v = hasVal(d.v) ? String(d.v) : '';
    const k = b.dataset.k;
    if (k === '⌫') v = v.slice(0, -1);
    else if (k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
    else if (v.length < 8) v = (v === '0' ? '' : v) + k;
    d.v = v; S.dirty = true; renderEntry();
  }
  else if (act === 'clear') { draftOf(S.active).v = ''; renderEntry(); }
  else if (act === 'same') {
    const i = findItem(S.active), d = draftOf(i.item_id);
    d.v = String(i.previous.v);
    if (i.input_type === 'pair' && !d.c && i.previous.c) d.c = i.previous.c;
    S.dirty = true; const nx = nextField(i); setActive(nx ? nx.item_id : null);
  }
  else if (act === 'nextField') { const nx = nextField(findItem(S.active)); setActive(nx ? nx.item_id : null); }
  else if (act === 'photo') {
    S.note = (document.getElementById('f-note') || {}).value ?? S.note;
    S.photoTarget = b.dataset.id || '';
    document.getElementById('photoInput').click();
  }
  else if (act === 'view') viewPhoto(b.dataset.key);
  else if (act === 'save') {
    const note = document.getElementById('f-note').value.trim();
    const records = locItems().filter(i => isDone(i, S.draft[i.item_id])).map(i => {
      const d = S.draft[i.item_id];
      if (i.input_type === 'bool') return { item_id: i.item_id, v: d.v };
      if (i.input_type === 'choice') return { item_id: i.item_id, c: d.c };
      if (i.input_type === 'num') return { item_id: i.item_id, v: Number(d.v) };
      return { item_id: i.item_id, c: d.c || '', v: hasVal(d.v) ? Number(d.v) : '' };
    });
    enqueue({ type: 'save', date: S.date, user: S.user, location: S.loc, note, records });
    const loc = S.loc;
    S.view = 'home'; S.active = null; S.dirty = false; render(); window.scrollTo(0, 0);
    toast(`${loc} を保存しました`);
  }
});
document.addEventListener('input', ev => { if (ev.target.id === 'f-note') { S.note = ev.target.value; S.dirty = true; } });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  kick(0);
  if (S.view !== 'home') return;
  if (S.date !== todayStr() && S.data && S.data.today === S.date) { S.date = todayStr(); S.data = fromCache(); render(); }
  load(true);
});
window.addEventListener('online', () => kick(0));
window.addEventListener('offline', updateSync);

if (!IS_GAS && !S.apiUrl) { S.view = 'url'; render(); }
else { S.data = fromCache(); if (S.data) OB.ops.forEach(applyOp); S.view = 'who'; render(); load(true); kick(0); }
</script>
</body>
